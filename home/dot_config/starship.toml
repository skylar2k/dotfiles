"$schema" = 'https://starship.rs/config-schema.json'

# Two lines: where you are and what is going on, then the prompt character on its own line.
# The host shows only over ssh, the user only over ssh or as root. Colours are the terminal's own (TokyoNight Moon).
format = """
$username$hostname$directory$git_branch$git_state$git_status$python$lua$zig$nodejs$jobs$cmd_duration
$character"""
add_newline = true
command_timeout = 500 # ms; a slow git status is cut off instead of freezing the prompt

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)" # red after a failed command
vimcmd_symbol = "[❮](bold yellow)" # vi normal mode (zsh-vi-mode); insert mode shows ❯
vimcmd_visual_symbol = "[❮](bold purple)"

[username]
format = "[$user]($style)@"
style_user = "bold yellow"
style_root = "bold red"

[hostname]
ssh_only = true
ssh_symbol = "󰣀 "
format = "[$ssh_symbol$hostname]($style) "
style = "bold green"

[directory]
truncation_length = 4
truncate_to_repo = true # inside a repo: start at the repo root
read_only = " 󰌾"
style = "bold blue"

[git_branch]
symbol = " "
format = "[$symbol$branch(:$remote_branch)]($style) "
style = "bold purple"

[git_state] # rebase, merge, cherry-pick in progress
format = '[\($state( $progress_current/$progress_total)\)]($style) '

[git_status]
format = "([$all_status$ahead_behind]($style) )"
style = "yellow"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇡${ahead_count}⇣${behind_count}"
conflicted = "=${count}"
untracked = "?${count}"
stashed = "≡${count}"
modified = "!${count}"
staged = "+${count}"
renamed = "»${count}"
deleted = "✘${count}"

[python] # version, and the virtualenv when one is active (uv's .venv included)
symbol = " "
format = '[$symbol$pyenv_prefix($version )(\($virtualenv\) )]($style)'

[lua]
symbol = " "
format = "[$symbol($version )]($style)"

[zig]
symbol = " "
format = "[$symbol($version )]($style)"

[nodejs]
symbol = " "
format = "[$symbol($version )]($style)"

[jobs] # background jobs (Ctrl-Z)
symbol = "✦"
format = "[$symbol$number]($style) "

[cmd_duration]
min_time = 2_000
format = "took [$duration]($style) "
style = "yellow"
